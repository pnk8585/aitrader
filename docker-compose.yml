# Local/dev compose. Production: ~/homeserver/docker-compose/aitrader/
services:
  aitrader:
    build: .
    image: dockerhub.pkatopodis.me/pank85/aitrader:latest
    container_name: aitrader
    restart: unless-stopped
    ports:
      - "9237:9237"
    env_file:
      - /home/pank/docker-data/aitrader/.env
    environment:
      - AITRADER_STATE_DIR=/state
      - PYTHONUNBUFFERED=1
    volumes:
      - /home/pank/docker-data/aitrader:/state
    extra_hosts:
      - "host.docker.internal:host-gateway"
    healthcheck:
      test:
        [
          "CMD",
          "python",
          "-c",
          "import urllib.request; urllib.request.urlopen('http://localhost:9237/healthz', timeout=3)",
        ]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 20s
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "5"
