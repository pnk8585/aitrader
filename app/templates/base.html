<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>{% block title %}AITrader{% endblock %}</title>
  <script src="https://unpkg.com/htmx.org@2.0.4" integrity="sha384-HGxK4QaSxht8hn3qNF5sEA0GxwDcjHxUqNT1xH0WxTjXKl/1oLF4UqhqwxA1hTI" crossorigin="anonymous"></script>
  <style>
    :root {
      --bg: #0f1117;
      --bg-card: #1a1d27;
      --bg-card-hover: #22263a;
      --border: #2a2d3a;
      --text: #e1e4ed;
      --text-muted: #8b8fa3;
      --accent: #6366f1;
      --accent-hover: #818cf8;
      --green: #22c55e;
      --amber: #f59e0b;
      --red: #ef4444;
      --radius: 8px;
    }
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      background: var(--bg);
      color: var(--text);
      min-height: 100vh;
    }
    nav {
      background: var(--bg-card);
      border-bottom: 1px solid var(--border);
      padding: 0 24px;
      display: flex;
      align-items: center;
      gap: 24px;
      height: 52px;
    }
    nav .brand { font-weight: 700; font-size: 16px; color: var(--accent); letter-spacing: -0.3px; }
    nav a {
      color: var(--text-muted);
      text-decoration: none;
      font-size: 14px;
      transition: color 0.15s;
    }
    nav a:hover, nav a.active { color: var(--text); }
    main { max-width: 960px; margin: 0 auto; padding: 32px 24px; }
    h1 { font-size: 22px; font-weight: 600; margin-bottom: 24px; }
    .cards { display: grid; grid-template-columns: repeat(auto-fill, minmax(200px, 1fr)); gap: 16px; margin-bottom: 32px; }
    .card {
      background: var(--bg-card);
      border: 1px solid var(--border);
      border-radius: var(--radius);
      padding: 20px;
    }
    .card .label { font-size: 12px; color: var(--text-muted); text-transform: uppercase; letter-spacing: 0.5px; margin-bottom: 6px; }
    .card .value { font-size: 28px; font-weight: 700; }
    .card .sub { font-size: 13px; color: var(--text-muted); margin-top: 4px; }
    .badge {
      display: inline-block;
      padding: 2px 8px;
      border-radius: 4px;
      font-size: 11px;
      font-weight: 600;
      text-transform: uppercase;
      letter-spacing: 0.3px;
    }
    .badge-live { background: rgb(34 197 94 / 0.15); color: var(--green); }
    .badge-paper { background: rgb(245 158 11 / 0.15); color: var(--amber); }
    .badge-paused { background: rgb(139 143 163 / 0.15); color: var(--text-muted); }
    table {
      width: 100%;
      border-collapse: collapse;
      font-size: 14px;
    }
    th {
      text-align: left;
      padding: 10px 12px;
      color: var(--text-muted);
      font-weight: 500;
      font-size: 12px;
      text-transform: uppercase;
      letter-spacing: 0.5px;
      border-bottom: 1px solid var(--border);
    }
    td {
      padding: 10px 12px;
      border-bottom: 1px solid var(--border);
    }
    tr:hover td { background: rgb(255 255 255 / 0.02); }
    .admin-links { display: grid; grid-template-columns: repeat(auto-fill, minmax(260px, 1fr)); gap: 16px; }
    .admin-link {
      display: block;
      background: var(--bg-card);
      border: 1px solid var(--border);
      border-radius: var(--radius);
      padding: 24px;
      color: var(--text);
      text-decoration: none;
      transition: background 0.15s, border-color 0.15s;
    }
    .admin-link:hover { background: var(--bg-card-hover); border-color: var(--accent); }
    .admin-link h3 { font-size: 16px; margin-bottom: 6px; }
    .admin-link p { font-size: 13px; color: var(--text-muted); }
    .flash { padding: 10px 16px; border-radius: var(--radius); font-size: 14px; margin-bottom: 16px; }
    .flash-ok { background: rgb(34 197 94 / 0.1); border: 1px solid rgb(34 197 94 / 0.25); color: var(--green); }
    .flash-err { background: rgb(239 68 68 / 0.1); border: 1px solid rgb(239 68 68 / 0.25); color: var(--red); }
    .text-muted { color: var(--text-muted); font-size: 13px; }
    .pagination { display: flex; align-items: center; gap: 12px; margin-top: 16px; font-size: 13px; }
    .pagination a { color: var(--accent); text-decoration: none; padding: 4px 10px; border: 1px solid var(--border); border-radius: 4px; }
    .pagination a.disabled { color: var(--text-muted); pointer-events: none; opacity: 0.5; }
    .pagination span { color: var(--text-muted); }
    .filter-input { background: var(--bg-card); color: var(--text); border: 1px solid var(--border); border-radius: 4px; padding: 4px 8px; font-size: 11px; width: 100%; min-width: 60px; }
    .filter-input:focus { border-color: var(--accent); outline: none; }
    .btn-sm { background: var(--accent); color: #fff; border: none; border-radius: 4px; padding: 6px 14px; font-size: 12px; cursor: pointer; margin-top: 4px; }
    .btn-sm:hover { background: var(--accent-hover); }
    .btn-action { background: var(--accent); color: #fff; border: none; border-radius: 6px; padding: 4px 12px; font-size: 12px; cursor: pointer; transition: opacity 0.15s; }
    .btn-action:hover { opacity: 0.85; }
    .btn-danger { background: var(--red); }
    th a { color: var(--text-muted); text-decoration: none; }
    th a:hover { color: var(--text); }
    th.sortable { cursor: pointer; user-select: none; }
    th.sortable:hover { opacity: 0.8; }
    th[data-sort-dir="asc"]::after { content: " ▲"; }
    th[data-sort-dir="desc"]::after { content: " ▼"; }
    .reason-cell { max-width: 180px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; cursor: pointer; }
    .reason-cell.expanded { max-width: none; white-space: normal; overflow: visible; }
    .nav-dropdown { position: relative; display: inline-flex; align-items: center; }
    .nav-dropdown > a { color: var(--text-muted); text-decoration: none; font-size: 14px; }
    .nav-dropdown > a:hover, .nav-dropdown > a.active { color: var(--text); }
    .nav-dropdown-menu { display: none; position: absolute; top: 100%; left: 0; background: var(--bg-card); border: 1px solid var(--border); border-radius: 4px; min-width: 160px; z-index: 100; padding: 4px 0; }
    .nav-dropdown:hover .nav-dropdown-menu { display: block; }
    .nav-dropdown-menu a { display: block; padding: 6px 14px; color: var(--text-muted); text-decoration: none; font-size: 13px; white-space: nowrap; }
    .nav-dropdown-menu a:hover { background: var(--bg-card-hover); color: var(--text); }
  </style>
</head>
<body>
  <nav>
    <span class="brand">AITrader</span>
    <a href="/" {% if request.url.path == "/" %}class="active"{% endif %}>Dashboard</a>
    <a href="/ui/admin" {% if request.url.path.startswith("/ui/admin") %}class="active"{% endif %}>Admin</a>
    <span style="color:var(--border);margin:0 4px">|</span>
    <div class="nav-dropdown">
      <a href="/ui/admin/data" {% if request.url.path.startswith("/ui/admin/data") %}class="active"{% endif %}>Data ▾</a>
      <div class="nav-dropdown-menu">
        <a href="/ui/admin/data/trade_log">Trade Log</a>
        <a href="/ui/admin/data/trading_state">Positions</a>
        <a href="/ui/admin/data/llm_review_log">LLM Reviews</a>
        <a href="/ui/admin/data/asset_prices">Prices</a>
        <a href="/ui/admin/data/cron_jobs">Cron Jobs</a>
        <a href="/ui/admin/data/cron_runs">Cron Runs</a>
      </div>
    </div>
  </nav>
  <main>
    {% block content %}{% endblock %}
  </main>
</body>
</html>
