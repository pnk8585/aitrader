{% if flash %}
<div class="flash flash-{{ flash_type }}">{{ flash }}</div>
{% endif %}
<div class="card" style="max-width:520px;">
  <style>
    .form-group { margin-bottom: 16px; }
    .form-group label { display: block; font-size: 13px; color: var(--text-muted); margin-bottom: 4px; }
    .form-group input { width: 100%; padding: 8px 12px; background: var(--bg); border: 1px solid var(--border); border-radius: 6px; color: var(--text); font-size: 14px; }
    .form-group input:focus { outline: none; border-color: var(--accent); }
    .form-group .hint { font-size: 12px; color: var(--text-muted); margin-top: 4px; }
    .btn { padding: 8px 20px; background: var(--accent); color: #fff; border: none; border-radius: 6px; font-size: 14px; font-weight: 500; cursor: pointer; transition: background 0.15s; }
    .btn:hover { background: var(--accent-hover); }
  </style>
  <form hx-post="/ui/admin/ai" hx-target="#ai-config" hx-swap="outerHTML">
    <div class="form-group">
      <label for="model">Model</label>
      <input type="text" id="model" name="model" value="{{ model }}" placeholder="e.g. deepseek-v4-flash" required>
    </div>
    <div class="form-group">
      <label for="base_url">Base URL</label>
      <input type="text" id="base_url" name="base_url" value="{{ base_url }}" placeholder="http://localhost:4000/v1" required>
      <div class="hint">Must start with http:// or https://</div>
    </div>
    <div class="form-group">
      <label for="api_key">API Key</label>
      <input type="password" id="api_key" name="api_key" value="" placeholder="{% if has_api_key %}{{ api_key_masked }} (leave blank to keep current){% else %}Enter API key{% endif %}">
      <div class="hint">{% if has_api_key %}Key is set. Leave blank to keep current value.{% else %}No key configured yet.{% endif %}</div>
    </div>
    <button type="submit" class="btn">Save</button>
  </form>
</div>
